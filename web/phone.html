<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KENIA | Phone Bridge</title>
  <link rel="icon" type="image/x-icon" href="/logotipo-VCMAS.ico" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e0eb;
      --text: #1e2a3a;
      --muted: #5f6f85;
      --ok: #1fa971;
      --bad: #c23939;
      --btn: #2d6cdf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(140deg, #f9fbff, #eef3ff);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(20, 39, 73, 0.08);
      padding: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; color: var(--muted); }
    .status {
      margin: 14px 0 18px;
      padding: 12px;
      border-radius: 10px;
      background: #f2f6ff;
      border: 1px solid #dce7ff;
      font-size: 14px;
    }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .box {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
    }
    .box h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #334862;
    }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    input {
      width: 100%;
      border: 1px solid #c8d3e2;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 10px;
      font-size: 14px;
      text-transform: uppercase;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--btn);
      color: white;
      font-weight: 600;
      cursor: pointer;
      min-height: 38px;
    }
    button.secondary { background: #63758e; }
    button.danger { background: var(--bad); }
    .perm-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #e4e9f1;
      padding: 8px 0;
      font-size: 14px;
    }
    .perm-val.granted, .perm-val.active { color: var(--ok); font-weight: 600; }
    .perm-val.denied { color: var(--bad); font-weight: 600; }
    .perm-val.pending, .perm-val.inactive { color: var(--muted); }
    .incoming {
      margin-top: 14px;
      border-radius: 10px;
      border: 1px solid #ffd7d7;
      background: #fff2f2;
      padding: 12px;
    }
    .incoming strong { color: #a12e2e; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Phone Bridge</h1>
    <p>Vincula este dispositivo como celular para recibir órdenes del dashboard.</p>

    <div id="status" class="status">Iniciando...</div>

    <section class="grid">
      <div class="box">
        <h2>Sesión</h2>
        <input id="sessionCode" placeholder="Código de sesión" maxlength="8" />
        <div class="row">
          <button id="joinSession">Vincular celular</button>
          <button id="stopBtn" class="danger">Desconectar</button>
        </div>
      </div>

      <div class="box">
        <h2>Permisos</h2>
        <div class="row">
          <button id="grantMicBtn">Permitir micrófono</button>
          <button id="grantNotifBtn" class="secondary">Notificaciones</button>
        </div>
        <div class="perm-item"><span>Micrófono</span><span id="permMic" class="perm-val pending">⏳ Verificando…</span></div>
        <div class="perm-item"><span>Notificaciones</span><span id="permNotif" class="perm-val pending">⏳ Verificando…</span></div>
        <div class="perm-item"><span>Wake Lock</span><span id="permWake" class="perm-val pending">⏳ Verificando…</span></div>
        <div class="perm-item"><span>Socket</span><span id="permSocket" class="perm-val pending">⏳ Verificando…</span></div>
      </div>
    </section>

    <section class="box" style="margin-top: 12px;">
      <h2>Estado de llamada</h2>
      <div class="row">
        <button id="acceptBtn">Reportar en llamada</button>
        <button id="idleBtn" class="secondary">Reportar libre</button>
        <button id="ringtoneBtn" class="secondary">Simular timbre</button>
      </div>
    </section>

    <section id="incomingBanner" class="incoming" style="display:none;">
      <strong>Llamada entrante:</strong>
      <span id="incomingNumber">—</span>
      <div class="row">
        <button id="acceptCallBtn">Aceptar</button>
        <button id="rejectCallBtn" class="danger">Rechazar</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="/phone.js"></script>
</body>
</html>
